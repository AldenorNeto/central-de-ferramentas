<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Central de ferramentas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23131516'/%3E%3Cpath d='M7 7h7v7H7zM18 7h7v7h-7zM7 18h7v7H7z' fill='none' stroke='%23d4a24c' stroke-width='2'/%3E%3Cpath d='M18 18h7v7h-7z' fill='%23d4a24c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tema.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .casca { display: grid; grid-template-columns: 232px 1fr; height: 100%; }

  nav { min-width: 0; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); min-height: 0; }
  .marca { padding: 20px 18px 14px; font-weight: 600; letter-spacing: .01em; }
  .lista { list-style: none; margin: 0; padding: 4px 8px; overflow-y: auto; flex: 1; }
  .lista a {
    display: flex; align-items: center; gap: 12px; padding: 9px 10px; margin-bottom: 1px;
    color: var(--muted); text-decoration: none; font-size: 14px; border-left: 2px solid transparent;
  }
  .lista a:hover { color: var(--text); background: var(--raised); }
  .lista a[aria-current="page"] { color: var(--text); background: var(--raised); border-left-color: var(--accent); }
  .lista a[aria-current="page"] svg { color: var(--accent); }
  .rodape { padding: 12px 18px; border-top: 1px solid var(--line); font-size: 12px; }
  .rodape a { color: var(--muted); text-decoration: none; }
  .rodape a:hover { color: var(--text); }

  #quadros { height: 100%; min-height: 0; min-width: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--bg); display: block; }
  iframe[hidden] { display: none; }

  @media (max-width: 720px) {
    .casca { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    nav { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); }
    .marca, .rodape { display: none; }
    .lista { display: flex; overflow-x: auto; overflow-y: hidden; padding: 0; scrollbar-width: none; }
    .lista::-webkit-scrollbar { display: none; }
    .lista li { flex: none; }
    .lista a { margin: 0; padding: 12px 14px; border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
    .lista a[aria-current="page"] { background: transparent; border-bottom-color: var(--accent); }
  }
</style>
</head>
<body>
<div class="casca">
  <nav aria-label="Ferramentas">
    <div class="marca">Central</div>
    <ul class="lista" id="lista"></ul>
    <div class="rodape"><a href="https://github.com/AldenorNeto/central-de-ferramentas" target="_blank" rel="noopener">Código</a></div>
  </nav>
  <div id="quadros"></div>
</div>

<script src="ferramentas.js"></script>
<script src="icones.js"></script>
<script>
  const lista = document.getElementById('lista'), quadros = document.getElementById('quadros');
  const guardar = { ler() { try { return localStorage.getItem('cf:ultima'); } catch (e) { return null; } },
                    gravar(v) { try { localStorage.setItem('cf:ultima', v); } catch (e) {} } };

  FERRAMENTAS.forEach(f => {
    const li = document.createElement('li'), a = document.createElement('a');
    a.href = '#' + f.id; a.dataset.id = f.id;
    a.innerHTML = icone(f.id) + '<span></span>';
    a.querySelector('span').textContent = f.nome;
    li.append(a); lista.append(li);
  });

  function abrir() {
    const pedida = decodeURIComponent(location.hash.slice(1));
    const alvo = FERRAMENTAS.find(f => f.id === pedida) || FERRAMENTAS.find(f => f.id === guardar.ler()) || FERRAMENTAS[0];
    lista.querySelectorAll('a').forEach(a => {
      if (a.dataset.id === alvo.id) { a.setAttribute('aria-current', 'page'); a.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
      else a.removeAttribute('aria-current');
    });
    // Cada ferramenta ganha seu quadro na primeira visita e continua viva, só escondida:
    // assim o mixer segue tocando enquanto você usa as outras.
    let q = quadros.querySelector('[data-id="' + alvo.id + '"]');
    if (!q) {
      q = document.createElement('iframe');
      q.dataset.id = alvo.id; q.title = alvo.nome; q.src = 'tools/' + alvo.id + '/';
      quadros.append(q);
    }
    quadros.querySelectorAll('iframe').forEach(f => { f.hidden = f !== q; });
    document.title = alvo.nome + ' · Central de ferramentas';
    guardar.gravar(alvo.id);
    if (pedida !== alvo.id) history.replaceState(null, '', '#' + alvo.id);
  }
  window.addEventListener('hashchange', abrir);
  abrir();
</script>
</body>
</html>
