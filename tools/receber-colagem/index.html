<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Receber colagem</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23131516'/%3E%3Cpath d='M9 3h6v4H9zM9 5H6v16h12V5h-3M9 12h6M9 16h6' fill='none' stroke='%23d4a24c' stroke-width='1.8' stroke-linecap='square' transform='translate%283 3%29 scale%28.75%29'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
textarea { width: 100%; height: 200px; font: 14px/1.5 var(--mono); white-space: pre; tab-size: 4; }
.acoes { display: flex; gap: 8px; }
details { margin-top: 22px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details textarea { height: 160px; margin-top: 8px; font-size: 12px; }
#origem { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Receber colagem</h1>
  <div class="campo">
    <label for="entrada">Cole aqui</label>
    <textarea id="entrada" spellcheck="false" autofocus></textarea>
  </div>
  <div class="campo">
    <label for="saida">Recebido <span id="origem"></span></label>
    <textarea id="saida" spellcheck="false" readonly></textarea>
  </div>
  <div class="acoes"><button id="limpar">Limpar</button></div>
  <details>
    <summary>O que veio na área de transferência</summary>
    <p id="tipos" class="rotulo"></p>
    <textarea id="bruto" spellcheck="false" readonly aria-label="HTML bruto"></textarea>
  </details>
</main>

<script>
  const entrada = document.getElementById('entrada'), saida = document.getElementById('saida');
  const origem = document.getElementById('origem'), tipos = document.getElementById('tipos'), bruto = document.getElementById('bruto');

  const BLOCOS = new Set(['ADDRESS','ARTICLE','ASIDE','BLOCKQUOTE','BR','DD','DIV','DL','DT','FIELDSET','FIGCAPTION','FIGURE','FOOTER','FORM','H1','H2','H3','H4','H5','H6','HEADER','HR','LI','MAIN','NAV','OL','P','PRE','SECTION','TABLE','TR','UL']);
  const IGNORAR = new Set(['SCRIPT','STYLE','TEMPLATE','HEAD','NOSCRIPT']);

  // HTML -> texto, sem executar nada (DOMParser é inerte). Quebra linha em blocos e junta o resto.
  function htmlParaTexto(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    let out = '';
    (function andar(no) {
      if (no.nodeType === 3) { out += no.nodeValue.replace(/\s+/g, ' '); return; }
      if (no.nodeType !== 1 || IGNORAR.has(no.tagName)) return;
      const bloco = BLOCOS.has(no.tagName);
      if (bloco) out += '\n';
      no.childNodes.forEach(andar);
      if (bloco) out += '\n';
    })(doc.body);
    return out.split('\n').map(l => l.trim()).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  // Colagem do Teams: <span data-teams> com um <span> por mensagem, e <p> dentro de cada uma.
  // O parágrafo só com &nbsp; é uma linha em branco; o resto do bloco é espaço de formatação.
  function textoInline(no) {
    if (no.nodeType === 3) return no.nodeValue.replace(/ /g, ' ');
    if (no.nodeType !== 1 || IGNORAR.has(no.tagName)) return '';
    if (no.tagName === 'BR') return '\n';
    if (no.tagName === 'IMG') return no.getAttribute('alt') || '';
    return [...no.childNodes].map(textoInline).join('');
  }
  function mensagensDoTeams(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const raiz = doc.querySelector('[data-teams]');
    if (!raiz) return null;
    return [...raiz.children].map(msg => {
      const ps = [...msg.querySelectorAll('p')];
      const linhas = ps.length ? ps.map(p => textoInline(p).replace(/\s+$/, '')) : [textoInline(msg).trim()];
      return linhas.join('\n').trim();
    }).filter(Boolean);
  }
  const SEPARADOR = '\n\n──────\n\n';

  let daColagem = false;
  entrada.addEventListener('paste', e => {
    const cd = e.clipboardData; if (!cd) return;
    const html = cd.getData('text/html'), plano = cd.getData('text/plain');
    tipos.textContent = 'Formatos: ' + ([...cd.types].join(', ') || 'nenhum');
    bruto.value = html;
    daColagem = true;
    const msgs = html ? mensagensDoTeams(html) : null;
    if (msgs) {
      saida.value = msgs.join(SEPARADOR);
      origem.textContent = '(Teams: ' + msgs.length + (msgs.length === 1 ? ' mensagem' : ' mensagens') + '; o Teams não envia nome nem horário)';
    } else if (html) { saida.value = htmlParaTexto(html); origem.textContent = '(lido do HTML)'; }
    else { saida.value = plano; origem.textContent = '(texto simples)'; }
  });
  // digitação normal: o de baixo espelha o de cima
  entrada.addEventListener('input', e => {
    if (e.inputType === 'insertFromPaste' && daColagem) { daColagem = false; return; }
    saida.value = entrada.value; origem.textContent = '';
  });
  document.getElementById('limpar').onclick = () => {
    entrada.value = ''; saida.value = ''; bruto.value = ''; tipos.textContent = ''; origem.textContent = ''; entrada.focus();
  };
</script>
</body>
</html>
