<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Receber colagem</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Crect%20width%3D%2724%27%20height%3D%2724%27%20fill%3D%27%23131516%27/%3E%3Cpath%20d%3D%27M9%203h6v4H9zM9%205H6v16h12V5h-3M9%2012h6M9%2016h6%27%20fill%3D%27none%27%20stroke%3D%27%23d4a24c%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27square%27%20transform%3D%27translate%283%203%29%20scale%28.75%29%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
.zona { display: grid; place-items: center; min-height: 120px; padding: 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r); cursor: pointer; }
.zona:hover, .zona.sobre, .zona:focus { outline: none; border-color: var(--accent); border-style: solid; color: var(--text); }
.zona input { display: none; }
#fotos { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; padding: 0; list-style: none; }
#fotos img { height: 48px; border-radius: 2px; border: 1px solid var(--line-2); display: block; }
#estado { min-height: 1.4em; margin: 10px 0 14px; }
#estado.erro { color: var(--bad); }
textarea { width: 100%; height: 340px; font: 14px/1.5 var(--mono); white-space: pre-wrap; }
.linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.linha label { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.linha input { width: 140px; }
</style>
</head>
<body>
<main>
  <h1>Receber colagem</h1>

  <label class="zona" id="zona" tabindex="0">
    <span>Cole o print da conversa aqui (Ctrl+V), arraste a imagem ou clique para escolher</span>
    <input type="file" id="arquivo" accept="image/*" multiple>
  </label>
  <ul id="fotos"></ul>
  <div id="estado" class="rotulo"></div>

  <textarea id="saida" spellcheck="false" readonly aria-label="Texto da conversa"></textarea>
  <div class="linha">
    <button id="copiar" class="primary">Copiar</button>
    <button id="limpar">Limpar</button>
    <label class="rotulo">Seu nome <input type="text" id="meuNome" value="Eu" autocomplete="off"></label>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const saida = $('saida'), estado = $('estado'), fotos = $('fotos'), meuNome = $('meuNome');

  try { meuNome.value = localStorage.getItem('cf:colagem:eu') || meuNome.value; } catch (e) {}

  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const mediana = a => { const b = [...a].sort((x, y) => x - y); return b.length ? b[b.length >> 1] : 0; };

  // ================= do print para as mensagens =================
  // O Teams mostra, em cada trecho de mensagens do mesmo autor, um cabeçalho com dia e hora:
  //   outra pessoa:  "Mateus Quintino sexta-feira 13:07"  (à esquerda, com o nome)
  //   você:          "sexta-feira 11:58"                  (encostado na margem direita, sem nome)
  // As linhas abaixo do cabeçalho são as mensagens daquele trecho. Uma folga maior que uma linha
  // entre duas linhas separa uma mensagem da seguinte.
  const CABECALHO = /(?:^|\s)(?:segunda|ter[cç]a|quarta|quinta|sexta|s[aá]bado|domingo)(?:-feira)?\s+(?:[àa]s\s+)?(?:[01]?\d|2[0-3])[:.][0-5]\d|(?:^|\s)(?:hoje|ontem|today|yesterday|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\s+(?:[àa]s\s+|at\s+)?(?:[01]?\d|2[0-3])[:.][0-5]\d|(?:^|\s)\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?,?\s+(?:[àa]s\s+)?(?:[01]?\d|2[0-3])[:.][0-5]\d/i;
  const SEPARADOR_DE_DIA = /^(?:segunda|terca|quarta|quinta|sexta|sabado|domingo|hoje|ontem|today|yesterday|monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?: feira)?$|^\d{1,2} \d{1,2}(?: \d{2,4})?$/;

  // linhas: [{ t, n, x0, x1, y0, y1, conf }]  (medidas em pixels da imagem original)
  function montarConversa(linhas, nomeEu) {
    const L = linhas.filter(l => l.conf >= 50 && l.n.length >= 2);
    if (!L.length) return { texto: '', runs: [] };
    const maxX1 = Math.max(...L.map(l => l.x1)); // margem direita do próprio chat
    const alturaTipica = mediana(L.map(l => l.y1 - l.y0).filter(h => h >= 6 && h <= 22)) || 12;
    const folga = alturaTipica * 1.3;
    const limpar = t => t.replace(/^[\[\(|]\S{1,5}[\]\)|]\s*/, ''); // a foto de perfil costuma sair como "[vo]"

    const runs = [];
    let run = null, bloco = null, ultY = null;
    const fechar = () => { if (bloco && bloco.partes.length) run.blocos.push(bloco.partes.join(' ')); bloco = null; };
    L.forEach(l => {
      const ehCab = l.t.length <= 70 && CABECALHO.test(l.t);
      if (ehCab) {
        fechar();
        const m = l.t.match(CABECALHO), nome = l.t.slice(0, m.index).trim().replace(/[\s|,:;-]+$/, ''), data = l.t.slice(m.index).trim();
        run = { lado: l.x1 >= 0.85 * maxX1 && l.x0 >= 0.4 * maxX1 ? 'dir' : 'esq', nome, data, blocos: [], xs: [] };
        runs.push(run); ultY = null; return;
      }
      if (SEPARADOR_DE_DIA.test(l.n)) { fechar(); runs.push({ dia: l.t }); run = null; ultY = null; return; }
      if (!run) { run = { lado: null, nome: '', data: '', blocos: [], xs: [] }; runs.push(run); } // print que começa no meio de um trecho
      const y1 = l.y1 - l.y0 > 22 ? l.y0 + alturaTipica : l.y1; // a foto de perfil alarga a primeira linha
      if (bloco && ultY !== null && l.y0 - ultY > folga) fechar();
      if (!bloco) bloco = { partes: [] };
      bloco.partes.push(limpar(l.t)); run.xs.push(l.x0); ultY = y1;
    });
    fechar();

    // trechos sem cabeçalho (início cortado): o lado sai da margem esquerda do texto, comparada com os trechos conhecidos
    const xmin = r => Math.min(...r.xs);
    const esq = runs.filter(r => r.lado === 'esq' && r.xs.length).map(xmin), dir = runs.filter(r => r.lado === 'dir' && r.xs.length).map(xmin);
    const tol = 0.04 * maxX1;
    runs.forEach(r => {
      if (r.dia !== undefined || r.lado !== null || !r.xs.length) return;
      if (esq.length) r.lado = xmin(r) <= mediana(esq) + tol ? 'esq' : 'dir';
      else if (dir.length) r.lado = xmin(r) >= Math.min(...dir) - tol ? 'dir' : 'esq';
    });

    const autor = r => r.lado === 'dir' ? (nomeEu.trim() || 'Eu') : r.lado === 'esq' ? (r.nome || 'Outro') : 'Desconhecido';
    const partes = [];
    runs.forEach(r => {
      if (r.dia !== undefined) { partes.push('— ' + r.dia + ' —'); return; }
      r.blocos.forEach((b, k) => partes.push(autor(r) + (k === 0 && r.data ? ' (' + r.data + ')' : '') + ': ' + b));
    });
    return { texto: partes.join('\n\n'), runs };
  }

  // ================= leitura da imagem (Tesseract.js, no navegador) =================
  const TESSERACT = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  let carregando = null;
  const carregarOcr = () => window.Tesseract ? Promise.resolve() : (carregando = carregando || new Promise((ok, falha) => {
    const s = document.createElement('script'); s.src = TESSERACT; s.onload = ok;
    s.onerror = () => { carregando = null; falha(new Error('não consegui baixar o leitor de texto (precisa de internet na primeira vez)')); };
    document.head.append(s);
  }));

  async function prepararImagem(arquivo) {
    const bmp = await createImageBitmap(arquivo);
    const k = bmp.width < 1400 ? 2 : 1; // imagens pequenas ficam mais legíveis ampliadas
    const c = document.createElement('canvas'); c.width = bmp.width * k; c.height = bmp.height * k;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, c.width, c.height);
    const img = g.getImageData(0, 0, c.width, c.height), d = img.data; let soma = 0;
    for (let i = 0; i < d.length; i += 4) { const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = d[i + 1] = d[i + 2] = y; soma += y; }
    if (soma / (d.length / 4) < 128) for (let i = 0; i < d.length; i += 4) d[i] = d[i + 1] = d[i + 2] = 255 - d[i]; // tema escuro: inverte
    g.putImageData(img, 0, 0);
    return { canvas: c, k };
  }

  async function lerLinhas(arquivo, rotulo) {
    await carregarOcr();
    const { canvas, k } = await prepararImagem(arquivo);
    const r = await Tesseract.recognize(canvas, 'por', {
      logger: m => { if (m.status === 'recognizing text') mostrar(rotulo + ' ' + Math.round(m.progress * 100) + '%'); },
    });
    const d = r.data, brutas = d.lines || (d.blocks || []).flatMap(b => b.paragraphs.flatMap(p => p.lines));
    return brutas.map(l => ({ t: l.text.trim(), n: norm(l.text), conf: l.confidence, x0: l.bbox.x0 / k, x1: l.bbox.x1 / k, y0: l.bbox.y0 / k, y1: l.bbox.y1 / k }));
  }

  // ================= tela =================
  let imagens = [];   // arquivos na ordem em que chegaram
  let linhasDe = new Map(); // arquivo -> linhas lidas (para não ler de novo ao mudar o nome)
  let ocupado = false;
  const mostrar = (t, erro) => { estado.textContent = t; estado.className = 'rotulo' + (erro ? ' erro' : ''); };

  function montarTudo() {
    const partes = imagens.map(a => linhasDe.get(a)).filter(Boolean).map(l => montarConversa(l, meuNome.value).texto).filter(Boolean);
    saida.value = partes.join('\n\n');
  }

  function desenharFotos() {
    fotos.replaceChildren(...imagens.map(a => { const li = document.createElement('li'), im = document.createElement('img'); im.src = a._url || (a._url = URL.createObjectURL(a)); im.alt = ''; li.append(im); return li; }));
  }

  async function processar() {
    if (ocupado) return;
    ocupado = true;
    try {
      for (let i = 0; i < imagens.length; i++) {
        const a = imagens[i];
        if (linhasDe.has(a)) continue;
        const rotulo = 'Lendo o print ' + (i + 1) + '/' + imagens.length + (window.Tesseract ? '…' : ' (na primeira vez baixa o leitor de texto)…');
        mostrar(rotulo);
        linhasDe.set(a, await lerLinhas(a, rotulo));
        montarTudo();
      }
      const n = saida.value ? saida.value.split('\n\n').filter(p => !p.startsWith('— ')).length : 0;
      mostrar(n ? 'Pronto: ' + n + ' mensagens. Confira os nomes e o texto antes de usar; o leitor pode errar uma letra aqui e ali.' : 'Não achei mensagens nesse print. Ele precisa mostrar a conversa com os cabeçalhos (nome e hora).', !n);
    } catch (e) { mostrar('Erro ao ler o print: ' + e.message, true); }
    finally { ocupado = false; }
  }

  function adicionar(arquivos) {
    const novas = [...arquivos].filter(f => f.type.startsWith('image/'));
    if (!novas.length) { mostrar('Isso não é uma imagem. Copie o print e cole de novo, ou escolha o arquivo.', true); return; }
    imagens.push(...novas); desenharFotos(); processar();
  }

  const arquivosDe = cd => {
    const f = [...(cd.files || [])];
    if (!f.length && cd.items) [...cd.items].forEach(it => { if (it.kind === 'file') { const a = it.getAsFile(); if (a) f.push(a); } });
    return f.filter(a => a.type.startsWith('image/'));
  };
  // colar em qualquer lugar da página
  document.addEventListener('paste', e => {
    if (e.target === meuNome) return;
    const cd = e.clipboardData; if (!cd) return;
    const imgs = arquivosDe(cd);
    if (imgs.length) { e.preventDefault(); adicionar(imgs); }
    else mostrar('Não veio imagem nessa colagem. Tire um print da conversa, copie a imagem e cole aqui.', true);
  });
  $('arquivo').addEventListener('change', e => { adicionar(e.target.files); e.target.value = ''; });
  const zona = $('zona');
  ['dragenter', 'dragover'].forEach(n => zona.addEventListener(n, e => { e.preventDefault(); zona.classList.add('sobre'); }));
  zona.addEventListener('dragleave', () => zona.classList.remove('sobre'));
  zona.addEventListener('drop', e => { e.preventDefault(); zona.classList.remove('sobre'); adicionar(e.dataTransfer.files); });

  meuNome.addEventListener('input', () => { try { localStorage.setItem('cf:colagem:eu', meuNome.value); } catch (e) {} montarTudo(); });
  $('copiar').onclick = async () => {
    if (!saida.value) return;
    try { await navigator.clipboard.writeText(saida.value); mostrar('Copiado.'); }
    catch (e) { saida.select(); mostrar('Selecionado; use Ctrl+C.'); }
  };
  $('limpar').onclick = () => {
    imagens.forEach(a => a._url && URL.revokeObjectURL(a._url)); imagens = []; linhasDe = new Map();
    fotos.replaceChildren(); saida.value = ''; mostrar('');
  };
</script>
</body>
</html>
