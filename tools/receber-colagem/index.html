<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Receber colagem</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Crect%20width%3D%2724%27%20height%3D%2724%27%20fill%3D%27%23131516%27/%3E%3Cpath%20d%3D%27M9%203h6v4H9zM9%205H6v16h12V5h-3M9%2012h6M9%2016h6%27%20fill%3D%27none%27%20stroke%3D%27%23d4a24c%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27square%27%20transform%3D%27translate%283%203%29%20scale%28.75%29%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
textarea { width: 100%; height: 150px; font: 14px/1.5 var(--mono); white-space: pre; tab-size: 4; }
.acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#origem { color: var(--accent); }

.nomes { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.nomes label { display: flex; flex-direction: column; gap: 4px; }
.nomes input { width: 180px; }

#msgs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.msg { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: start; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.msg .quem { justify-content: center; width: 100%; padding: 5px 8px; font-size: 13px; }
.msg.eu .quem { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.msg .corpo { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.msg .resposta { color: var(--muted); font-size: 12px; margin-bottom: 4px; border-left: 2px solid var(--line-2); padding-left: 8px; }
.dica { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
@media (max-width: 560px) { .msg { grid-template-columns: 1fr; } }

details { margin-top: 22px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details textarea { height: 160px; margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Receber colagem</h1>

  <div class="campo">
    <label for="entrada">Cole aqui</label>
    <textarea id="entrada" spellcheck="false" autofocus></textarea>
  </div>

  <section id="painel" hidden>
    <div class="nomes">
      <label>Seu nome <input type="text" id="nomeEu" value="Aldenor" autocomplete="off"></label>
      <label>Outra pessoa <input type="text" id="nomeOutro" value="Quintino" autocomplete="off"></label>
    </div>
    <p class="dica">O Teams não envia quem falou, então marquei sozinho o que dá para deduzir (respostas e quem chama o outro pelo nome). Clique no nome de uma mensagem para trocar: ela e as seguintes sem pista mudam juntas.</p>
    <div id="msgs"></div>
  </section>

  <div class="campo">
    <label for="saida">Recebido <span id="origem"></span></label>
    <textarea id="saida" spellcheck="false" readonly></textarea>
  </div>
  <div class="acoes">
    <button id="copiar" class="primary">Copiar</button>
    <button id="limpar">Limpar</button>
    <span id="aviso" class="rotulo"></span>
  </div>

  <details>
    <summary>O que veio na área de transferência</summary>
    <p id="tipos" class="rotulo"></p>
    <textarea id="bruto" spellcheck="false" readonly aria-label="HTML bruto"></textarea>
  </details>
</main>

<script>
  const $ = id => document.getElementById(id);
  const entrada = $('entrada'), saida = $('saida'), origem = $('origem'), tipos = $('tipos'), bruto = $('bruto');
  const painel = $('painel'), listaMsgs = $('msgs'), nomeEu = $('nomeEu'), nomeOutro = $('nomeOutro'), aviso = $('aviso');

  // nomes lembrados neste navegador
  try {
    nomeEu.value = localStorage.getItem('cf:colagem:eu') || nomeEu.value;
    nomeOutro.value = localStorage.getItem('cf:colagem:outro') || nomeOutro.value;
  } catch (e) {}

  const BLOCOS = new Set(['ADDRESS','ARTICLE','ASIDE','BLOCKQUOTE','BR','DD','DIV','DL','DT','FIELDSET','FIGCAPTION','FIGURE','FOOTER','FORM','H1','H2','H3','H4','H5','H6','HEADER','HR','LI','MAIN','NAV','OL','P','PRE','SECTION','TABLE','TR','UL']);
  const IGNORAR = new Set(['SCRIPT','STYLE','TEMPLATE','HEAD','NOSCRIPT']);

  // ---------- HTML genérico -> texto (colagens que não são do Teams) ----------
  function htmlParaTexto(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    let out = '';
    (function andar(no) {
      if (no.nodeType === 3) { out += no.nodeValue.replace(/\s+/g, ' '); return; }
      if (no.nodeType !== 1 || IGNORAR.has(no.tagName)) return;
      const bloco = BLOCOS.has(no.tagName);
      if (bloco) out += '\n';
      no.childNodes.forEach(andar);
      if (bloco) out += '\n';
    })(doc.body);
    return out.split('\n').map(l => l.trim()).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  // ---------- Teams ----------
  // <span data-teams> > um <span> por mensagem > <p>/<ul> com o texto. Respostas vêm num
  // <blockquote itemtype=".../Reply"> com o autor e a prévia da mensagem citada.
  function textoInline(no) {
    if (no.nodeType === 3) return no.nodeValue.replace(/ /g, ' ');
    if (no.nodeType !== 1 || IGNORAR.has(no.tagName)) return '';
    if (no.tagName === 'BR') return '\n';
    if (no.tagName === 'IMG') return no.getAttribute('alt') || '';
    if (no.tagName === 'A') {
      const href = no.getAttribute('href') || '', t = [...no.childNodes].map(textoInline).join('').trim();
      // o Teams corta o texto do link com "…": o endereço completo está no href
      if (!href || t === href) return href || t;
      return /^https?:\/\//.test(t) || !t ? href : t + ' (' + href + ')';
    }
    return [...no.childNodes].map(textoInline).join('');
  }

  function mensagensDoTeams(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const raiz = doc.querySelector('[data-teams]');
    if (!raiz) return null;
    return [...raiz.children].map(msg => {
      let resposta = null;
      const q = msg.querySelector('blockquote');
      if (q) {
        const autor = q.querySelector('[itemprop="mri"]'), previa = q.querySelector('[itemprop="preview"]');
        resposta = { autor: autor ? autor.textContent.trim() : '', previa: previa ? textoInline(previa).trim() : '' };
      }
      const temLink = !!msg.querySelector('a[itemtype*="HyperLink"]');
      const linhas = [];
      msg.querySelectorAll('p, ul, ol').forEach(el => {
        if (el.closest('blockquote') || (el.tagName === 'P' && el.closest('li'))) return;
        if (el.tagName === 'P') {
          // cartão de pré-visualização de link ("Jira", "Log in with…"): ruído para quem lê
          if (temLink && /margin:\s*0/.test(el.getAttribute('style') || '')) return;
          linhas.push(textoInline(el).replace(/\s+$/, ''));
        } else {
          el.querySelectorAll(':scope > li').forEach(li => {
            const t = textoInline(li).replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, '\n').trim();
            linhas.push('- ' + t.replace(/\n/g, '\n  '));
          });
        }
      });
      let texto = linhas.join('\n').trim();
      if (!linhas.length) texto = textoInline(msg).trim();
      return { texto, resposta };
    }).filter(m => m.texto || m.resposta);
  }

  // ---------- quem falou ----------
  let msgs = [];          // { texto, resposta, quem: 'eu'|'outro', manual }
  const nome = quem => (quem === 'eu' ? nomeEu.value.trim() || 'Eu' : nomeOutro.value.trim() || 'Outro');

  function atribuir() {
    const tok = el => el.value.trim().split(/\s+/)[0].toLowerCase();
    const eu = tok(nomeEu), outro = tok(nomeOutro);
    const cita = (texto, n) => !!n && texto.toLowerCase().split(/[^\p{L}\p{N}]+/u).includes(n);
    msgs.forEach(m => {
      m.manual = false;
      // 1) uma resposta a mensagem de um lado vem do outro lado
      if (m.resposta && m.resposta.autor && eu) {
        m.quem = m.resposta.autor.toLowerCase().includes(eu) ? 'outro' : 'eu'; m.manual = true; return;
      }
      // 2) quem chama alguém pelo nome no começo da mensagem ("Opa Aldenor", "Quintino, ...") não é essa pessoa
      const inicio = m.texto.slice(0, 60);
      const falaComEu = cita(inicio, eu), falaComOutro = cita(inicio, outro);
      if (falaComEu !== falaComOutro) { m.quem = falaComEu ? 'outro' : 'eu'; m.manual = true; }
    });
    // o que ficou sem pista segue o bloco anterior
    msgs.forEach((m, k) => { if (!m.manual) m.quem = k ? msgs[k - 1].quem : 'outro'; });
  }

  function trocar(i) {
    const alvo = msgs[i].quem === 'eu' ? 'outro' : 'eu';
    msgs[i].quem = alvo; msgs[i].manual = true;
    for (let j = i + 1; j < msgs.length && !msgs[j].manual; j++) msgs[j].quem = alvo;
    desenhar();
  }

  function linhaDe(m) {
    let t = nome(m.quem) + ': ';
    if (m.resposta) t += '(em resposta a ' + (m.resposta.autor || 'outra mensagem') + (m.resposta.previa ? ': "' + m.resposta.previa + '"' : '') + ')\n';
    return t + m.texto;
  }

  function desenhar() {
    listaMsgs.replaceChildren(...msgs.map((m, i) => {
      const d = document.createElement('div'); d.className = 'msg ' + m.quem;
      const b = document.createElement('button'); b.className = 'quem'; b.textContent = nome(m.quem);
      b.title = 'Trocar quem falou'; b.onclick = () => trocar(i);
      const c = document.createElement('div'); c.className = 'corpo';
      if (m.resposta) {
        const r = document.createElement('div'); r.className = 'resposta';
        r.textContent = 'Em resposta a ' + (m.resposta.autor || 'outra mensagem') + (m.resposta.previa ? ': ' + m.resposta.previa : '');
        c.append(r);
      }
      c.append(document.createTextNode(m.texto));
      d.append(b, c); return d;
    }));
    saida.value = msgs.map(linhaDe).join('\n\n');
  }

  [nomeEu, nomeOutro].forEach((el, k) => el.addEventListener('input', () => {
    try { localStorage.setItem(k ? 'cf:colagem:outro' : 'cf:colagem:eu', el.value); } catch (e) {}
    if (msgs.length) { atribuir(); desenhar(); }
  }));

  // ---------- colagem ----------
  let daColagem = false;
  entrada.addEventListener('paste', e => {
    const cd = e.clipboardData; if (!cd) return;
    const html = cd.getData('text/html'), plano = cd.getData('text/plain');
    tipos.textContent = 'Formatos: ' + ([...cd.types].join(', ') || 'nenhum');
    bruto.value = html;
    daColagem = true;
    const lidas = html ? mensagensDoTeams(html) : null;
    if (lidas) {
      msgs = lidas.map(m => ({ ...m, quem: 'outro', manual: false }));
      atribuir();
      painel.hidden = false;
      origem.textContent = '(Teams: ' + msgs.length + (msgs.length === 1 ? ' mensagem' : ' mensagens') + ')';
      desenhar();
    } else {
      msgs = []; painel.hidden = true;
      if (html) { saida.value = htmlParaTexto(html); origem.textContent = '(lido do HTML)'; }
      else { saida.value = plano; origem.textContent = '(texto simples)'; }
    }
  });
  // digitação normal: o de baixo espelha o de cima
  entrada.addEventListener('input', e => {
    if (e.inputType === 'insertFromPaste' && daColagem) { daColagem = false; return; }
    msgs = []; painel.hidden = true; saida.value = entrada.value; origem.textContent = '';
  });

  $('copiar').onclick = async () => {
    try { await navigator.clipboard.writeText(saida.value); aviso.textContent = 'Copiado'; }
    catch (e) { saida.select(); aviso.textContent = 'Selecionado; use Ctrl+C'; }
    setTimeout(() => { aviso.textContent = ''; }, 1500);
  };
  $('limpar').onclick = () => {
    entrada.value = ''; saida.value = ''; bruto.value = ''; tipos.textContent = ''; origem.textContent = '';
    msgs = []; painel.hidden = true; entrada.focus();
  };
</script>
</body>
</html>
