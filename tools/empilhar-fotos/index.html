<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Empilhar fotos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23131516'/%3E%3Cpath d='M4 5h16v6h-16z M4 13h16v6h-16z' fill='none' stroke='%23d4a24c' stroke-width='1.9' stroke-linejoin='round' transform='translate%283 3%29 scale%28.75%29'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
main { max-width: 980px; }
.acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.acoes .fim { margin-left: auto; }
#estado { font-size: 13px; color: var(--muted); }
#estado.erro { color: var(--bad); }
#solta { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 22px; text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 16px; }
#solta.sobre { border-color: var(--accent); color: var(--text); }
#lista { list-style: none; margin: 0 0 20px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
#lista li { display: grid; grid-template-columns: 22px 96px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
#lista li.arrastando { opacity: .4; }
#lista li.alvo { border-color: var(--accent); }
.pega { color: var(--muted); cursor: grab; display: flex; justify-content: center; user-select: none; }
.mini { width: 96px; height: 64px; object-fit: contain; background: var(--bg); border-radius: 2px; display: block; }
.info { min-width: 0; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.info b { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alt { display: flex; align-items: center; gap: 6px; }
.alt input { width: 84px; font-variant-numeric: tabular-nums; }
.btns { display: flex; gap: 4px; }
.btns button { padding: 6px; }
.btns button[disabled] { opacity: .3; cursor: default; }
.todas { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.todas input { width: 84px; }
#previa { margin-top: 8px; border: 1px solid var(--line); border-radius: var(--r); background: repeating-conic-gradient(#1a1d1f 0 25%, #1f2326 0 50%) 0 0 / 16px 16px; padding: 12px; overflow: auto; max-height: 70vh; }
#caixa { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; }
#previa canvas { display: block; max-width: 100%; height: auto; cursor: move; touch-action: none; user-select: none; }
.corte { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.corte label { display: flex; align-items: center; gap: 6px; }
.corte input { width: 74px; font-variant-numeric: tabular-nums; }
.dica { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.linha-junta { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--accent); pointer-events: none; display: none; }
#caixa:hover .linha-junta, #caixa.arrasta .linha-junta { display: block; }
#sel { position: absolute; border: 1px solid var(--accent); background: rgba(212,162,76,.08); pointer-events: none; display: none; }
#caixa.arrasta #sel { display: block; }
@media (max-width: 600px) {
  #lista li { grid-template-columns: 22px 64px 1fr; }
  .mini { width: 64px; height: 48px; }
  .btns { grid-column: 2 / -1; }
}
</style>
</head>
<body>
<main>
  <h1>Empilhar fotos</h1>

  <div id="solta">Arraste as fotos até aqui, cole com Ctrl+V ou use o botão abaixo.</div>

  <div class="acoes">
    <button id="anexar" class="primary">Anexar fotos</button>
    <input type="file" id="arquivos" accept="image/*" multiple hidden>
    <button id="limpar">Limpar</button>
    <span class="todas fim"><label for="altTodas">Mesma altura para todas</label><input type="number" id="altTodas" min="16" max="8000" step="10" placeholder="px"><button id="aplicarTodas">Aplicar</button></span>
  </div>

  <ul id="lista"></ul>

  <div class="acoes">
    <button id="baixar" class="primary" disabled>Baixar imagem</button>
    <button id="copiar" disabled>Copiar</button>
    <span id="estado" role="status"></span>
  </div>

  <p class="dica" id="dica" hidden>Na imagem abaixo, arraste uma foto para o lado para alinhá-la, ou para cima para cortar o começo dela (some a linha repetida). Os mesmos valores estão nos campos de cada foto.</p>
  <div id="previa" hidden><div id="caixa"><canvas id="tela"></canvas><div id="sel"></div></div></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const lista = $('lista'), tela = $('tela'), estado = $('estado');
  const LIMITE = 16000;            // lado máximo seguro de um canvas na maioria dos navegadores
  let itens = [];                  // { id, nome, bmp, w, h, alt }
  let seq = 0;

  const dizer = (t, erro) => { estado.textContent = t || ''; estado.className = erro ? 'erro' : ''; };
  const ICO = {
    sobe: '<svg class="i" viewBox="0 0 24 24"><path d="M6 15l6 -6l6 6"/></svg>',
    desce: '<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6l6 -6"/></svg>',
    fora: '<svg class="i" viewBox="0 0 24 24"><path d="M18 6l-12 12 M6 6l12 12"/></svg>',
    pega: '<svg class="i" viewBox="0 0 24 24"><path d="M9 5h.01 M9 12h.01 M9 19h.01 M15 5h.01 M15 12h.01 M15 19h.01"/></svg>',
  };

  async function adicionar(arquivos) {
    const imgs = [...arquivos].filter(f => f.type.startsWith('image/'));
    if (!imgs.length) { dizer('Nenhuma imagem encontrada.', true); return; }
    dizer('Carregando…');
    let falhas = 0;
    for (const f of imgs) {
      try {
        const bmp = await createImageBitmap(f);   // respeita a rotação do celular (EXIF)
        itens.push({ id: ++seq, nome: f.name || 'colada', bmp, w: bmp.width, h: bmp.height, alt: bmp.height, ct: 0, cb: 0, dx: 0 });
      } catch (e) { falhas++; }
    }
    dizer(falhas ? falhas + ' arquivo(s) não puderam ser lidos.' : '', !!falhas);
    desenhar();
  }

  // mantém pelo menos 8 px visíveis
  function limitar(it) {
    it.ct = Math.max(0, Math.min(it.ct, it.alt - 8 - it.cb));
    it.cb = Math.max(0, Math.min(it.cb, it.alt - 8 - it.ct));
  }
  // escreve os valores do item nos campos da linha (sem recriar a lista)
  function campos(it, li) {
    li = li || lista.querySelector('li[data-id="' + it.id + '"]'); if (!li) return;
    const set = (c, v) => { const e = li.querySelector('[data-c=' + c + ']'); if (e && document.activeElement !== e) e.value = Math.round(v); };
    set('alt', it.alt); set('ct', it.ct); set('cb', it.cb); set('dx', it.dx);
    li.querySelector('.alt .rotulo').textContent = '× ' + Math.round(it.w * it.alt / it.h) + ' px de largura';
  }

  function renderLista() {
    lista.textContent = '';
    itens.forEach((it, i) => {
      const li = document.createElement('li');
      li.draggable = true; li.dataset.id = it.id;
      li.innerHTML = '<span class="pega" title="Arraste para mudar a ordem">' + ICO.pega + '</span>' +
        '<canvas class="mini"></canvas>' +
        '<div class="info"><b></b><div class="alt"><label>Altura</label><input type="number" data-c="alt" min="16" max="8000" step="10"><span class="rotulo"></span></div>' +
        '<div class="corte"><label>Cortar topo<input type="number" data-c="ct" min="0" step="1"></label>' +
        '<label>Cortar base<input type="number" data-c="cb" min="0" step="1"></label>' +
        '<label>Lateral<input type="number" data-c="dx" step="1"></label></div></div>' +
        '<div class="btns"><button data-a="sobe" title="Subir" aria-label="Subir">' + ICO.sobe + '</button>' +
        '<button data-a="desce" title="Descer" aria-label="Descer">' + ICO.desce + '</button>' +
        '<button data-a="fora" class="danger" title="Remover" aria-label="Remover">' + ICO.fora + '</button></div>';
      li.querySelector('b').textContent = (i + 1) + '. ' + it.nome;
      const m = li.querySelector('canvas.mini'); m.width = 96; m.height = 64;
      const k = Math.min(96 / it.w, 64 / it.h), mw = it.w * k, mh = it.h * k;
      m.getContext('2d').drawImage(it.bmp, (96 - mw) / 2, (64 - mh) / 2, mw, mh);
      li.querySelectorAll('input[data-c]').forEach(inp => {
        inp.addEventListener('input', () => {
          const c = inp.dataset.c, v = Math.round(+inp.value);
          if (inp.value === '' || isNaN(v)) return;
          if (c === 'alt') {
            if (v < 16 || v > 8000) return;
            const f = v / it.alt; it.ct *= f; it.cb *= f; it.dx *= f; it.alt = v;
            li.querySelector('[data-c=ct]').value = Math.round(it.ct);
            li.querySelector('[data-c=cb]').value = Math.round(it.cb);
            li.querySelector('[data-c=dx]').value = Math.round(it.dx);
          } else if (c === 'dx') it.dx = v;
          else it[c] = Math.max(0, v);
          limitar(it); campos(it, li); montar();
        });
      });
      campos(it, li);
      li.querySelector('[data-a=sobe]').disabled = i === 0;
      li.querySelector('[data-a=desce]').disabled = i === itens.length - 1;
      lista.append(li);
    });
  }

  lista.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const li = b.closest('li'), i = itens.findIndex(x => x.id == li.dataset.id);
    if (b.dataset.a === 'sobe' && i > 0) [itens[i - 1], itens[i]] = [itens[i], itens[i - 1]];
    if (b.dataset.a === 'desce' && i < itens.length - 1) [itens[i + 1], itens[i]] = [itens[i], itens[i + 1]];
    if (b.dataset.a === 'fora') { itens[i].bmp.close && itens[i].bmp.close(); itens.splice(i, 1); }
    desenhar();
  });

  // arrastar para reordenar
  let arrastado = null;
  lista.addEventListener('dragstart', e => {
    const li = e.target.closest('li'); if (!li) return;
    arrastado = li.dataset.id; li.classList.add('arrastando'); e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', arrastado); } catch (x) {}
  });
  lista.addEventListener('dragend', () => { arrastado = null; lista.querySelectorAll('li').forEach(l => l.classList.remove('arrastando', 'alvo')); });
  lista.addEventListener('dragover', e => {
    if (!arrastado) return;
    e.preventDefault();
    const li = e.target.closest('li');
    lista.querySelectorAll('li.alvo').forEach(l => l.classList.remove('alvo'));
    if (li && li.dataset.id !== arrastado) li.classList.add('alvo');
  });
  lista.addEventListener('drop', e => {
    if (!arrastado) return;
    e.preventDefault(); e.stopPropagation();
    const li = e.target.closest('li'); if (!li || li.dataset.id === arrastado) return;
    const de = itens.findIndex(x => x.id == arrastado), para = itens.findIndex(x => x.id == li.dataset.id);
    const [x] = itens.splice(de, 1); itens.splice(para, 0, x);
    desenhar();
  });

  // junta tudo em um canvas: cada foto na altura escolhida, centralizada, uma abaixo da outra
  function montar() {
    const prev = $('previa');
    if (!itens.length) { prev.hidden = true; $('baixar').disabled = $('copiar').disabled = true; return; }
    // cada foto: largura proporcional à altura escolhida; sem deslocamento fica centralizada
    const dims = itens.map(it => { limitar(it); return { it, w: Math.round(it.w * it.alt / it.h), h: Math.round(it.alt - it.ct - it.cb) }; });
    const Wmax = Math.max(...dims.map(d => d.w));
    dims.forEach(d => { d.esq = (Wmax - d.w) / 2 + d.it.dx; });
    const minL = Math.min(0, ...dims.map(d => d.esq)), maxR = Math.max(Wmax, ...dims.map(d => d.esq + d.w));
    const W = Math.round(maxR - minL), H = dims.reduce((s, d) => s + d.h, 0);
    if (W > LIMITE || H > LIMITE) {
      prev.hidden = true; $('dica').hidden = true; $('baixar').disabled = $('copiar').disabled = true;
      dizer('A imagem final ficaria com ' + W + ' × ' + H + ' px, grande demais. Diminua as alturas.', true); return;
    }
    tela.width = W; tela.height = H;
    const c = tela.getContext('2d'); c.imageSmoothingQuality = 'high';
    let y = 0;
    lay = dims.map(d => {
      const k = d.it.alt / d.it.h, x = Math.round(d.esq - minL);
      c.drawImage(d.it.bmp, 0, d.it.ct / k, d.it.w, d.h / k, x, y, d.w, d.h);   // recorte feito na foto original
      const r = { it: d.it, x, y, w: d.w, h: d.h }; y += d.h; return r;
    });
    // linhas tracejadas nas emendas (só na tela, não vão para a imagem)
    caixa.querySelectorAll('.linha-junta').forEach(e => e.remove());
    lay.slice(1).forEach(r => { const l = document.createElement('div'); l.className = 'linha-junta'; l.style.top = (r.y / H * 100) + '%'; caixa.append(l); });
    prev.hidden = false; $('dica').hidden = false; $('baixar').disabled = $('copiar').disabled = false;
    dizer('Imagem final: ' + W + ' × ' + H + ' px');
  }

  // arrastar na prévia: horizontal alinha a foto, vertical corta o começo dela
  let lay = [], gesto = null;
  const caixa = $('caixa'), sel = $('sel');
  const escala = () => tela.width / tela.getBoundingClientRect().width;
  function marcar(r) {
    sel.style.left = (r.x / tela.width * 100) + '%'; sel.style.width = (r.w / tela.width * 100) + '%';
    sel.style.top = (r.y / tela.height * 100) + '%'; sel.style.height = (r.h / tela.height * 100) + '%';
  }
  tela.addEventListener('pointerdown', e => {
    const b = tela.getBoundingClientRect(), s = escala(), y = (e.clientY - b.top) * s;
    const r = lay.find(r => y >= r.y && y < r.y + r.h); if (!r) return;
    gesto = { r, px: e.clientX, py: e.clientY, eixo: null, dx0: r.it.dx, ct0: r.it.ct, s };
    tela.setPointerCapture(e.pointerId); caixa.classList.add('arrasta'); marcar(r); e.preventDefault();
  });
  tela.addEventListener('pointermove', e => {
    if (!gesto) return;
    const ddx = (e.clientX - gesto.px) * gesto.s, ddy = (e.clientY - gesto.py) * gesto.s;
    if (!gesto.eixo && Math.max(Math.abs(ddx), Math.abs(ddy)) > 6 * gesto.s) gesto.eixo = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'y';
    const it = gesto.r.it;
    if (gesto.eixo === 'x') it.dx = Math.round(gesto.dx0 + ddx);
    else if (gesto.eixo === 'y') { it.ct = Math.max(0, Math.round(gesto.ct0 - ddy)); limitar(it); }
    else return;
    campos(it); montar(); const nr = lay.find(r => r.it === it); if (nr) marcar(nr);
  });
  const fim = () => { gesto = null; caixa.classList.remove('arrasta'); };
  tela.addEventListener('pointerup', fim); tela.addEventListener('pointercancel', fim);
  function desenhar() { renderLista(); montar(); }

  $('anexar').onclick = () => $('arquivos').click();
  $('arquivos').onchange = e => { adicionar(e.target.files); e.target.value = ''; };
  $('limpar').onclick = () => { itens.forEach(i => i.bmp.close && i.bmp.close()); itens = []; dizer(''); desenhar(); };
  $('aplicarTodas').onclick = () => {
    const v = Math.round(+$('altTodas').value);
    if (!(v >= 16 && v <= 8000)) { dizer('Informe uma altura entre 16 e 8000 px.', true); return; }
    itens.forEach(i => { const f = v / i.alt; i.ct *= f; i.cb *= f; i.dx *= f; i.alt = v; }); desenhar();
  };

  // soltar arquivos e colar
  const solta = $('solta');
  ['dragenter', 'dragover'].forEach(n => document.addEventListener(n, e => { if (!arrastado && e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); solta.classList.add('sobre'); } }));
  ['dragleave', 'drop'].forEach(n => document.addEventListener(n, e => { if (n === 'drop' || e.target === document.documentElement || !e.relatedTarget) solta.classList.remove('sobre'); }));
  document.addEventListener('drop', e => { if (!arrastado && e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); adicionar(e.dataTransfer.files); } });
  document.addEventListener('paste', e => { const fs = [...(e.clipboardData ? e.clipboardData.files : [])]; if (fs.length) { e.preventDefault(); adicionar(fs); } });

  function nomeArquivo() { const d = new Date(), p = n => String(n).padStart(2, '0'); return 'empilhado-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.png'; }
  $('baixar').onclick = () => tela.toBlob(b => {
    if (!b) { dizer('Não consegui gerar a imagem.', true); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nomeArquivo();
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
  $('copiar').onclick = () => tela.toBlob(async b => {
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]); dizer('Imagem copiada.'); }
    catch (e) { dizer('O navegador não deixou copiar. Use Baixar imagem.', true); }
  }, 'image/png');
</script>
</body>
</html>
