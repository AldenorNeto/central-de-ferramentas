<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Diferença entre horários</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23131516'/%3E%3Cpath d='M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5.5l3.5 2' fill='none' stroke='%23d4a24c' stroke-width='1.8' stroke-linecap='square' transform='translate%283 3%29 scale%28.75%29'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
.row { display: grid; grid-template-columns: minmax(0, 110px) minmax(0, 110px) minmax(80px, 150px) 40px 40px; gap: 10px; align-items: center; }
.cab { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
#rows { display: flex; flex-direction: column; gap: 10px; }
input[type=text] { width: 100%; padding-inline: 4px; text-align: center; font: 600 20px var(--mono); font-variant-numeric: tabular-nums; }
input.bad { border-color: var(--bad); }
.res { font-variant-numeric: tabular-nums; line-height: 1.25; }
.res small { display: block; color: var(--muted); font-size: 12px; }
.row button { width: 40px; height: 40px; justify-content: center; padding: 0; }
.total { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
#totalMin { font: 600 clamp(44px, 13vw, 88px)/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
#totalHm { margin-top: 6px; font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .row { gap: 6px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(70px, 1fr) 34px 34px; } .row button { width: 34px; } input[type=text] { font-size: 17px; } }
#note { margin-top: 18px; color: var(--muted); font-size: 13px; max-width: 520px; }
</style>
</head>
<body>
<main>
  <h1>Diferença entre horários</h1>
  <div class="cab"><div class="row"><span>De</span><span>Até</span><span>Duração</span><span></span><span></span></div></div>
  <div id="rows"></div>
  <div class="total">
    <div id="totalMin">0 min</div>
    <div id="totalHm">0h 00min</div>
  </div>
  <div id="note">Formato HH:MM, 24 horas. Se o fim for menor que o início, conta como dia seguinte.</div>
</main>

<script src="../../icones.js"></script>
<script>
      const rowsEl = document.getElementById("rows");
      const VALID = /^([01]\d|2[0-3]):[0-5]\d$/;
      const toMin = (v) => {
        const [h, m] = v.split(":").map(Number);
        return h * 60 + m;
      };
      const hm = (d) =>
        `${Math.floor(d / 60)}h ${String(d % 60).padStart(2, "0")}min`;

      function mask(raw) {
        if (/^\d:/.test(raw)) raw = "0" + raw; // "9:30" -> "09:30"
        const d = raw.replace(/\D/g, "").slice(0, 4);
        return d.length > 2 ? d.slice(0, 2) + ":" + d.slice(2) : d;
      }

      function makeInput(value) {
        const i = document.createElement("input");
        i.type = "text";
        i.inputMode = "numeric";
        i.placeholder = "HH:MM";
        i.maxLength = 5;
        i.value = value || "";
        return i;
      }

      function addRow(afterRow, a = "", b = "") {
        const row = document.createElement("div");
        row.className = "row";
        const res = document.createElement("div");
        res.className = "res";
        const add = document.createElement("button");
        add.className = "add";
        add.innerHTML = icone("mais");
        add.title = "Adicionar intervalo";
        const del = document.createElement("button");
        del.className = "del";
        del.innerHTML = icone("fechar");
        del.title = "Remover";
        row.append(makeInput(a), makeInput(b), res, add, del);
        afterRow ? afterRow.after(row) : rowsEl.append(row);
        return row;
      }

      function calc() {
        let total = 0;
        for (const row of rowsEl.children) {
          const [ia, ib] = row.querySelectorAll("input");
          const res = row.querySelector(".res");
          ia.classList.toggle(
            "bad",
            ia.value.length === 5 && !VALID.test(ia.value),
          );
          ib.classList.toggle(
            "bad",
            ib.value.length === 5 && !VALID.test(ib.value),
          );
          if (!VALID.test(ia.value) || !VALID.test(ib.value)) {
            res.textContent = "—";
            continue;
          }
          let d = toMin(ib.value) - toMin(ia.value);
          const crossed = d < 0;
          if (crossed) d += 1440;
          total += d;
          res.innerHTML = `${d} min<small>${hm(d)}${crossed ? " · dia seguinte" : ""}</small>`;
        }
        document.getElementById("totalMin").textContent = total + " min";
        document.getElementById("totalHm").textContent = hm(total);
      }

      rowsEl.addEventListener("input", (e) => {
        if (e.target.tagName === "INPUT") {
          e.target.value = mask(e.target.value);
          // pula para o próximo campo ao completar HH:MM
          if (e.target.value.length === 5) {
            const inputs = [...rowsEl.querySelectorAll("input")];
            const next = inputs[inputs.indexOf(e.target) + 1];
            if (next && !next.value && e.inputType !== "deleteContentBackward")
              next.focus();
          }
        }
        calc();
      });

      rowsEl.addEventListener("click", (e) => {
        const row = e.target.closest(".row");
        if (!row) return;
        const btn = e.target.closest("button");
        if (btn && btn.classList.contains("add"))
          addRow(row).querySelector("input").focus();
        if (btn && btn.classList.contains("del")) {
          if (rowsEl.children.length > 1) row.remove();
          else row.querySelectorAll("input").forEach((i) => (i.value = ""));
          calc();
        }
      });

      addRow(null, "21:48", "23:31");
      calc();
    </script>
</body>
</html>
