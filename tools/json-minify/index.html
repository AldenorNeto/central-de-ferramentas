<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>JSON Minify</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23131516'/%3E%3Cpath d='M9 4H7v6l-2.5 2L7 14v6h2M15 4h2v6l2.5 2-2.5 2v6h-2' fill='none' stroke='%23d4a24c' stroke-width='1.8' stroke-linecap='square' transform='translate%283 3%29 scale%28.75%29'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
.bloco { margin-bottom: 22px; }
.topo { display: flex; justify-content: space-between; align-items: center; min-height: 34px; margin-bottom: 8px; }
.stats { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats .saved { color: var(--ok); font-weight: 600; }
textarea { width: 100%; min-height: 220px; font: 13px/1.5 var(--mono); }
.saida { min-height: 84px; max-height: 320px; overflow-y: auto; padding: 10px; font: 13px/1.5 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); word-break: break-all; white-space: pre-wrap; user-select: all; }
.saida.error { color: var(--bad); border-color: var(--bad); }
#copy-btn.copied { border-color: var(--ok); color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>JSON Minify</h1>
  <div class="bloco">
    <div class="topo"><label for="input">Entrada</label><span class="stats" id="stats"></span></div>
    <textarea id="input" spellcheck="false" placeholder='{
  "nome": "exemplo",
  "itens": [
    1,
    2,
    3
  ]
}'></textarea>
  </div>
  <div class="bloco">
    <div class="topo"><span class="rotulo">Saída</span><button id="copy-btn">Copiar</button></div>
    <div class="saida" id="output"></div>
  </div>
</main>

<script>
      const input = document.getElementById("input");
      const output = document.getElementById("output");
      const copyBtn = document.getElementById("copy-btn");
      const stats = document.getElementById("stats");

      function minify() {
        const raw = input.value.trim();
        if (!raw) {
          output.textContent = "";
          output.classList.remove("error");
          stats.innerHTML = "";
          return;
        }

        try {
          const parsed = JSON.parse(raw);
          const minified = JSON.stringify(parsed);
          output.textContent = minified;
          output.classList.remove("error");

          const originalLen = raw.length;
          const minifiedLen = minified.length;
          const saved = originalLen - minifiedLen;
          const percent = ((saved / originalLen) * 100).toFixed(0);
          stats.innerHTML = `${originalLen} → ${minifiedLen} chars (<span class="saved">−${percent}%</span>)`;
        } catch (e) {
          output.textContent = "JSON inválido: " + e.message;
          output.classList.add("error");
          stats.innerHTML = "";
        }
      }

      copyBtn.addEventListener("click", () => {
        const text = output.textContent;
        if (!text || output.classList.contains("error")) return;

        navigator.clipboard
          .writeText(text)
          .then(() => {
            copyBtn.textContent = "Copiado";
            copyBtn.classList.add("copied");
            setTimeout(() => {
              copyBtn.textContent = "Copiar";
              copyBtn.classList.remove("copied");
            }, 1000);
          })
          .catch(() => {
            copyBtn.textContent = "Erro";
            setTimeout(() => {
              copyBtn.textContent = "Copiar";
            }, 1000);
          });
      });

      input.addEventListener("input", minify);
      minify();
    </script>
</body>
</html>
