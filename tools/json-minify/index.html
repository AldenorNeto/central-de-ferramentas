<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Minify</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: #0d1117;
        min-height: 100vh;
        padding: 40px 20px;
        color: #c9d1d9;
      }
      .header {
        text-align: center;
        margin-bottom: 40px;
      }
      .header h1 {
        color: #58a6ff;
        font-size: 32px;
        margin-bottom: 8px;
      }
      .header p {
        color: #8b949e;
        font-size: 14px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 24px;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .label {
        font-size: 12px;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .stats {
        font-size: 12px;
        color: #8b949e;
      }
      .stats .saved {
        color: #3fb950;
        font-weight: 600;
      }
      textarea {
        width: 100%;
        font-size: 13px;
        color: #c9d1d9;
        font-family: "Courier New", monospace;
        background: #0d1117;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #30363d;
        resize: vertical;
        min-height: 200px;
        outline: none;
      }
      textarea:focus {
        border-color: #58a6ff;
      }
      .output-area {
        width: 100%;
        font-size: 13px;
        color: #c9d1d9;
        font-family: "Courier New", monospace;
        background: #0d1117;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #30363d;
        min-height: 80px;
        max-height: 300px;
        overflow-y: auto;
        word-break: break-all;
        white-space: pre-wrap;
        user-select: all;
      }
      .error {
        color: #f85149;
        border-color: #f85149;
      }
      .btn-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .copy-btn {
        background: #238636;
        color: #fff;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
        white-space: nowrap;
        font-weight: 500;
        border: none;
      }
      .copy-btn:hover {
        background: #2ea043;
      }
      .copy-btn.copied {
        background: #1f6feb;
      }
    </style>
  </head>
  <body>
    <a href="../../" style="display:inline-block;margin:0 0 14px;font-size:13px;color:#58a6ff;text-decoration:none">← Central de ferramentas</a>
    <div class="header">
      <h1>📦 JSON Minify</h1>
      <p>Cola o JSON formatado, recebe ele em uma linha s&oacute;.</p>
    </div>

    <div class="container">
      <div class="card">
        <div class="card-header">
          <span class="label">Input (JSON formatado)</span>
          <span class="stats" id="stats"></span>
        </div>
        <textarea
          id="input"
          placeholder='{
  "name": "exemplo",
  "items": [
    1,
    2,
    3
  ]
}'
        ></textarea>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="label">Output (minificado)</span>
          <div class="btn-row">
            <button class="copy-btn" id="copy-btn">Copy</button>
          </div>
        </div>
        <div class="output-area" id="output"></div>
      </div>
    </div>

    <script>
      const input = document.getElementById("input");
      const output = document.getElementById("output");
      const copyBtn = document.getElementById("copy-btn");
      const stats = document.getElementById("stats");

      function minify() {
        const raw = input.value.trim();
        if (!raw) {
          output.textContent = "";
          output.classList.remove("error");
          stats.innerHTML = "";
          return;
        }

        try {
          const parsed = JSON.parse(raw);
          const minified = JSON.stringify(parsed);
          output.textContent = minified;
          output.classList.remove("error");

          const originalLen = raw.length;
          const minifiedLen = minified.length;
          const saved = originalLen - minifiedLen;
          const percent = ((saved / originalLen) * 100).toFixed(0);
          stats.innerHTML = `${originalLen} → ${minifiedLen} chars (<span class="saved">-${percent}%</span>)`;
        } catch (e) {
          output.textContent = "JSON inv\u00E1lido: " + e.message;
          output.classList.add("error");
          stats.innerHTML = "";
        }
      }

      copyBtn.addEventListener("click", () => {
        const text = output.textContent;
        if (!text || output.classList.contains("error")) return;

        navigator.clipboard
          .writeText(text)
          .then(() => {
            copyBtn.textContent = "Copied";
            copyBtn.classList.add("copied");
            setTimeout(() => {
              copyBtn.textContent = "Copy";
              copyBtn.classList.remove("copied");
            }, 1000);
          })
          .catch(() => {
            copyBtn.textContent = "Error";
            setTimeout(() => {
              copyBtn.textContent = "Copy";
            }, 1000);
          });
      });

      input.addEventListener("input", minify);
      minify();
    </script>
  </body>
</html>
