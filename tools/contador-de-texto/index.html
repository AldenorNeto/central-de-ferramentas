<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Contador de texto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23131516'/%3E%3Cpath d='M4 6h16M4 11h16M4 16h9M17 14v6M14 17h6' fill='none' stroke='%23d4a24c' stroke-width='1.8' stroke-linecap='square' transform='translate%283 3%29 scale%28.75%29'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
textarea { width: 100%; height: 240px; line-height: 1.6; }
.acoes { margin: 12px 0 20px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat span { font-size: 13px; color: var(--muted); }
.stat b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Contador de texto</h1>
  <textarea id="t" placeholder="Cole ou digite o texto" aria-label="Texto"></textarea>
  <div class="acoes"><button id="limpar">Limpar</button></div>
  <div class="stats" id="stats"></div>
</main>

<script>
  const t = document.getElementById('t'), stats = document.getElementById('stats');
  const seg = new Intl.Segmenter('pt', { granularity: 'grapheme' });

  function contar() {
    const s = t.value, vazio = !s.trim();
    const palavras = vazio ? 0 : s.trim().split(/\s+/).length;
    const itens = [
      ['Caracteres', [...seg.segment(s)].length],
      ['Sem espaços', [...seg.segment(s.replace(/\s/g, ''))].length],
      ['Palavras', palavras],
      ['Linhas', s ? s.split('\n').length : 0],
      ['Parágrafos', vazio ? 0 : s.split(/\n\s*\n/).filter(p => p.trim()).length],
      ['Frases', vazio ? 0 : (s.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || []).filter(p => p.trim()).length],
      ['Bytes (UTF-8)', new TextEncoder().encode(s).length],
      ['Leitura', palavras ? Math.max(1, Math.round(palavras / 200)) + ' min' : '0 min'],
    ];
    stats.replaceChildren(...itens.map(([nome, valor]) => {
      const d = document.createElement('div'); d.className = 'stat';
      d.innerHTML = '<span></span><b></b>'; d.querySelector('b').textContent = valor; d.querySelector('span').textContent = nome;
      return d;
    }));
  }

  t.addEventListener('input', contar);
  document.getElementById('limpar').onclick = () => { t.value = ''; contar(); t.focus(); };
  contar();
</script>
</body>
</html>
