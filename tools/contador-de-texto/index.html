<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Contador de texto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e293b'/%3E%3Cpath d='M16 20h32M16 32h32M16 44h20' stroke='%23818cf8' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; accent-color: #818cf8; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0b1120; color: #e2e8f0; margin: 0; padding: 24px; }
  main { max-width: 900px; margin: 0 auto; }
  .voltar { display: inline-block; margin: 0 0 14px; font-size: 13px; color: #a5b4fc; text-decoration: none; }
  .voltar:hover { text-decoration: underline; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  textarea { width: 100%; height: 260px; padding: 12px; resize: vertical; font: 15px/1.6 system-ui, sans-serif; border: 1px solid #26334f; border-radius: 8px; background: #111a2e; color: #f8fafc; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
  .stat { background: #172036; border: 1px solid #26334f; border-radius: 10px; padding: 12px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: #8b9bb8; }
  button { font: inherit; font-size: 13px; margin-top: 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid #26334f; background: #111a2e; color: #e2e8f0; cursor: pointer; }
  button:hover { background: #172036; }
</style>
</head>
<body>
<main>
  <a class="voltar" href="../../">← Central de ferramentas</a>
  <h1>🔤 Contador de texto</h1>
  <textarea id="t" placeholder="Cole ou digite o texto aqui…" aria-label="Texto"></textarea>
  <div><button id="limpar">Limpar</button></div>
  <div class="stats" id="stats"></div>
</main>

<script>
  const t = document.getElementById('t'), stats = document.getElementById('stats');
  const seg = new Intl.Segmenter('pt', { granularity: 'grapheme' });

  function contar() {
    const s = t.value, vazio = !s.trim();
    const palavras = vazio ? 0 : s.trim().split(/\s+/).length;
    const itens = [
      ['Caracteres', [...seg.segment(s)].length],
      ['Sem espaços', [...seg.segment(s.replace(/\s/g, ''))].length],
      ['Palavras', palavras],
      ['Linhas', s ? s.split('\n').length : 0],
      ['Parágrafos', vazio ? 0 : s.split(/\n\s*\n/).filter(p => p.trim()).length],
      ['Frases', vazio ? 0 : (s.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || []).filter(p => p.trim()).length],
      ['Bytes (UTF-8)', new TextEncoder().encode(s).length],
      ['Leitura', palavras ? Math.max(1, Math.round(palavras / 200)) + ' min' : '0 min'],
    ];
    stats.replaceChildren(...itens.map(([nome, valor]) => {
      const d = document.createElement('div'); d.className = 'stat';
      d.innerHTML = '<b></b><span></span>'; d.querySelector('b').textContent = valor; d.querySelector('span').textContent = nome;
      return d;
    }));
  }

  t.addEventListener('input', contar);
  document.getElementById('limpar').onclick = () => { t.value = ''; contar(); t.focus(); };
  contar();
</script>
</body>
</html>
