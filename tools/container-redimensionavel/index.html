<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Container redimensionável</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23131516'/%3E%3Cpath d='M4 4h16v16H4zM20 12l-8 8M20 16.5l-3.5 3.5' fill='none' stroke='%23d4a24c' stroke-width='1.8' stroke-linecap='square' transform='translate%283 3%29 scale%28.75%29'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
.controles { display: grid; gap: 14px; max-width: 520px; margin-bottom: 24px; }
.controles label { display: flex; flex-direction: column; gap: 5px; }
.controles textarea { min-height: 84px; }
.linha { display: flex; align-items: center; gap: 12px; }
.linha input[type=number] { width: 72px; }
.caixa { width: 360px; height: 220px; min-width: 120px; min-height: 80px; resize: both; overflow: auto; padding: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); }
#size { margin-top: 10px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Container redimensionável</h1>
  <div class="controles">
    <label>Texto
      <textarea id="text">Arraste o canto inferior direito deste container para redimensioná-lo. O texto se ajusta conforme a largura e a altura mudam. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</textarea>
    </label>
    <label>Tamanho da fonte (px)
      <div class="linha">
        <input type="range" id="fsRange" min="8" max="96" value="16">
        <input type="number" id="fsNum" min="1" max="300" value="16">
      </div>
    </label>
  </div>
  <div class="caixa" id="box"></div>
  <div id="size"></div>
</main>

<script>
      const box = document.getElementById("box"),
        out = document.getElementById("size");
      const text = document.getElementById("text");
      const range = document.getElementById("fsRange"),
        num = document.getElementById("fsNum");

      const setText = () => (box.textContent = text.value);
      const setFont = (v) => {
        box.style.fontSize = v + "px";
        range.value = v;
        num.value = v;
      };

      text.addEventListener("input", setText);
      range.addEventListener("input", () => setFont(range.value));
      num.addEventListener("input", () => {
        if (num.value > 0) setFont(num.value);
      });

      const show = () =>
        (out.textContent = `${Math.round(box.offsetWidth)} × ${Math.round(box.offsetHeight)} px`);
      new ResizeObserver(show).observe(box);

      setText();
      setFont(16);
      show();
    </script>
</body>
</html>
