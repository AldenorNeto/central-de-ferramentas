<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Chave da OpenAI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Crect%20width%3D%2724%27%20height%3D%2724%27%20fill%3D%27%23131516%27/%3E%3Cpath%20d%3D%27M8%2015a4%204%200%201%201%203.9-4.9L20%2012v3h-3v3h-3v-2.2L11.9%2015zM7.5%2010.5h.01%27%20fill%3D%27none%27%20stroke%3D%27%23d4a24c%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27square%27%20transform%3D%27translate%283%203%29%20scale%28.75%29%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
main { max-width: 560px; }
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
input[type=password], input[type=text] { width: 100%; font-family: var(--mono); }
.acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
#estado { font-size: 13px; color: var(--muted); }
#estado.ok { color: var(--ok); }
#estado.erro { color: var(--bad); }
.nota { font-size: 13px; color: var(--muted); max-width: 60ch; }
</style>
</head>
<body>
<main>
  <h1>Chave da OpenAI</h1>

  <div class="campo">
    <label for="chave">Chave</label>
    <input type="password" id="chave" placeholder="sk-…" spellcheck="false" autocomplete="off" autofocus>
  </div>
  <div class="acoes">
    <button id="salvar" class="primary">Salvar</button>
    <button id="apagar" class="danger">Remover</button>
    <span id="estado" role="status"></span>
  </div>
  <p class="nota">Fica salva só neste navegador, em texto simples (<code>localStorage</code>), e as ferramentas só a enviam para a OpenAI. Use uma chave com limite de gasto.</p>
</main>

<script src="../../chave.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const mostrar = (texto, tipo) => {
    $('estado').textContent = texto || (CHAVE_OPENAI.existe() ? 'Chave salva: ' + CHAVE_OPENAI.mascarada() : 'Nenhuma chave salva.');
    $('estado').className = tipo || (CHAVE_OPENAI.existe() ? 'ok' : '');
  };
  const salvar = () => {
    const v = $('chave').value.trim();
    if (!v) { mostrar('Cole a chave no campo.', 'erro'); return; }
    if (!CHAVE_OPENAI.gravar(v)) { mostrar('O navegador bloqueou o armazenamento.', 'erro'); return; }
    $('chave').value = ''; mostrar();
  };
  $('salvar').onclick = salvar;
  $('chave').addEventListener('keydown', e => { if (e.key === 'Enter') salvar(); });
  $('apagar').onclick = () => { CHAVE_OPENAI.apagar(); $('chave').value = ''; mostrar(); };
  mostrar();
</script>
</body>
</html>
