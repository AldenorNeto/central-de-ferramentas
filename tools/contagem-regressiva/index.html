<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Contagem regressiva</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23131516'/%3E%3Cpath d='M7 3h10M7 21h10M8 3v4l4 5-4 5v4M16 3v4l-4 5 4 5v4' fill='none' stroke='%23d4a24c' stroke-width='1.8' stroke-linecap='square' transform='translate%283 3%29 scale%28.75%29'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../tema.css">
<style>
.campos { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.campos label { display: flex; flex-direction: column; gap: 4px; }
.campos input { width: 88px; font-size: 18px; font-variant-numeric: tabular-nums; }
.botoes { display: flex; gap: 8px; margin-left: 4px; }
#tempo { margin: 36px 0 8px; font: 600 clamp(52px, 15vw, 112px)/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
#tempo.fim { color: var(--bad); }
#status { min-height: 1.4em; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Contagem regressiva</h1>
  <div class="campos">
    <label>Horas <input type="number" id="h" min="0" value="0"></label>
    <label>Minutos <input type="number" id="m" min="0" value="25"></label>
    <label>Segundos <input type="number" id="s" min="0" value="0"></label>
    <div class="botoes">
      <button id="iniciar" class="primary">Iniciar</button>
      <button id="pausar">Pausar</button>
      <button id="zerar">Zerar</button>
    </div>
  </div>
  <div id="tempo">00:25:00</div>
  <div id="status"></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  let restante = 0, fimEm = 0, relogio = null;

  const pad = n => String(n).padStart(2, '0');
  const fmt = ms => { const s = Math.ceil(ms / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
  const doCampo = () => (((+$('h').value || 0) * 60 + (+$('m').value || 0)) * 60 + (+$('s').value || 0)) * 1000;

  function desenhar() {
    $('tempo').textContent = fmt(restante);
    document.title = relogio ? fmt(restante) + ' – Contagem regressiva' : 'Contagem regressiva';
  }
  const parar = () => { clearInterval(relogio); relogio = null; };

  function apito() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination);
      o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 700);
    } catch (e) { /* sem áudio: o aviso visual basta */ }
  }

  function passo() {
    restante = Math.max(0, fimEm - Date.now());
    desenhar();
    if (restante === 0) { parar(); $('tempo').classList.add('fim'); $('status').textContent = 'Tempo esgotado'; apito(); }
  }

  $('iniciar').onclick = () => {
    if (relogio) return;
    if (!restante) restante = doCampo();
    if (!restante) return;
    $('tempo').classList.remove('fim'); $('status').textContent = '';
    fimEm = Date.now() + restante;
    relogio = setInterval(passo, 200); passo();
  };
  $('pausar').onclick = () => { if (relogio) { parar(); $('status').textContent = 'Pausado'; desenhar(); } };
  $('zerar').onclick = () => { parar(); restante = doCampo(); $('tempo').classList.remove('fim'); $('status').textContent = ''; desenhar(); };
  ['h', 'm', 's'].forEach(id => $(id).addEventListener('input', () => { if (!relogio) { restante = doCampo(); desenhar(); } }));

  restante = doCampo(); desenhar();
</script>
</body>
</html>
